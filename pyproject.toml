[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-vuln-scanner"
dynamic = ["version"]
description = "Security scanner for Docker hosts, containers, images, Dockerfiles and Compose files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "surs51" }]
requires-python = ">=3.9"
keywords = ["docker", "security", "scanner", "containers", "devsecops", "sarif"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/surs51/docker-vuln-scanner"
Issues = "https://github.com/surs51/docker-vuln-scanner/issues"

[project.scripts]
dvscan = "dvscan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "dvscan.__version__" }

[tool.setuptools.packages.find]
include = ["dvscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
